name: E2E Full Suite

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  e2e-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            viewport: desktop
            project: chromium
          - browser: chromium
            viewport: mobile
            project: mobile-chrome
          - browser: firefox
            viewport: desktop
            project: firefox
          - browser: webkit
            viewport: desktop
            project: webkit
          - browser: webkit
            viewport: mobile
            project: mobile-safari
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Build application
        run: yarn build

      - name: Run E2E Tests
        run: yarn test:e2e --project=${{ matrix.project }}
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.viewport }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Build application
        run: yarn build

      - name: Run Accessibility Tests
        run: yarn test:e2e --project=chromium --grep @a11y
        env:
          CI: true

      - name: Upload Accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
