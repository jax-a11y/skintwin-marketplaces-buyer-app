name: Release Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      
      - name: Run linting
        run: yarn lint
      
      - name: Build application
        run: yarn build
      
      - name: Run unit tests
        run: yarn test:run --coverage
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Run full E2E suite
        run: yarn test:e2e
        env:
          CI: true
      
      - name: Run accessibility audit
        run: yarn test:e2e --grep @a11y
        env:
          CI: true
      
      - name: Upload all test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-artifacts
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 30
      
      - name: Release Ready
        run: |
          echo "✅ All release gates passed for ${{ inputs.environment }}"
          echo ""
          echo "Summary:"
          echo "  - Linting: ✓ Passed"
          echo "  - Build: ✓ Passed"
          echo "  - Unit Tests: ✓ Passed"
          echo "  - E2E Tests: ✓ Passed"
          echo "  - Accessibility: ✓ Passed"
          echo ""
          echo "Ready to deploy to ${{ inputs.environment }}"
